# iwd 3.12 (the Wi-Fi backend selected via WIRELESS_DAEMON = "iwd") refuses to
# start when the kernel does not expose the AF_ALG userspace crypto interface.
# Observed on boot test 02/03 (neura-boot-test-03.log): iwd.service failed with
#
#     No HMAC(SHA1) support found / No CMAC(AES) / DES support not found /
#     No Diffie-Hellman support ...
#     The following options are missing in the kernel:
#     CONFIG_CRYPTO_USER_API_HASH CONFIG_CRYPTO_USER_API_SKCIPHER
#     CONFIG_KEY_DH_OPERATIONS CRYPTO_ECB CRYPTO_MD5 CRYPTO_CBC CRYPTO_SHA256
#     CRYPTO_AES CRYPTO_DES CRYPTO_CMAC CRYPTO_HMAC CRYPTO_SHA512 CRYPTO_SHA1
#
# iwd's bundled ELL implements l_hash_is_supported()/l_cipher_is_supported()/
# l_key_is_supported() only through AF_ALG sockets (ell/cipher.c,
# ell/checksum.c), with no fallback, so CRYPTO_USER_API_{HASH,SKCIPHER,RNG,AEAD}
# must exist for the self-check to pass; CRYPTO_MD5/CRYPTO_DES must be actual
# algorithms because iwd hard-fails on DES/AES before starting.  CRYPTO_AES,
# CRYPTO_CBC, CRYPTO_ECB, CRYPTO_SHA1/256/512, CRYPTO_HMAC and CRYPTO_CMAC are
# already =y from x86_64_defconfig + the other fragments; the names for them in
# iwd's message are hint text only.
#
# Everything here is built-in (=y): the modules-neura-x86-64.tgz ships no
# kernel/crypto or kernel/crypto/asymmetric_keys modules at all, and
# iwd's RRECOMMENDS kernel-module-pkcs8-key-parser & friends are weak (they
# resolve once the code is built-in).  CRYPTO_USER_API itself is promptless and
# arrives via select; CRYPTO_DH/CRYPTO_KDF800108_CTR arrive via the
# KEY_DH_OPERATIONS selects (security/keys/Kconfig:110).  Built-in
# PKCS8_PRIVATE_KEY_PARSER also clears the boot test 02 error
# "systemd-modules-load: Failed to find module 'pkcs8_key_parser'" because
# modprobe from /lib/modules-load.d/pkcs8.conf then resolves it from
# modules.builtin.

CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_RNG=y
CONFIG_CRYPTO_USER_API_AEAD=y
CONFIG_CRYPTO_USER_API_ENABLE_OBSOLETE=y
CONFIG_CRYPTO_MD5=y
CONFIG_CRYPTO_DES=y
CONFIG_KEY_DH_OPERATIONS=y
CONFIG_PKCS8_PRIVATE_KEY_PARSER=y
