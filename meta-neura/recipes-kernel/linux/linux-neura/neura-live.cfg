# NEURA config fragment: what the live (read-only media + writable session)
# boot path needs on top of the base configuration.
#
# The live artifacts are produced by image-live.bbclass (IMAGE_FSTYPES "live")
# and booted by OE-Core's own init-live.sh
# (meta/recipes-core/initrdscripts/files/init-live.sh).  That init script
# loop-mounts the ext4 rootfs.img out of the ISO and, because the media is
# read-only, turns it into a writable session with a tmpfs-backed union mount:
#
#   mount -t overlay overlay -o lowerdir=/rootfs.ro,upperdir=...,workdir=...
#
# so CONFIG_OVERLAY_FS is the one symbol the base configuration is missing for
# the "temporary root filesystem" requirement.  init-live.sh falls back to aufs
# (not configured here) and otherwise boots a tmpfs-only root, which would not
# be usable - hence this fragment.
#
# The remaining pieces of the chain are already enabled by
# arch/x86/configs/x86_64_defconfig and neura-boot.cfg: ISO9660 (+JOLIET), VFAT
# (the EFI system partition image inside the ISO), BLK_DEV_LOOP, TMPFS, EXT4_FS,
# DEVTMPFS.

CONFIG_OVERLAY_FS=y
