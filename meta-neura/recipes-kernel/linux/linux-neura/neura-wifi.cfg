# NEURA config fragment: Wi-Fi device drivers for the x86-64 PC baseline.
#
# Scope: the chip families that are actually sold in x86-64 laptops/desktops
# (Intel, MediaTek, Realtek, Qualcomm) plus the two USB buses a desktop might
# use.  Everything is built as a module so the base kernel stays small and the
# firmware-loading behaviour is the normal modprobe path.
#
# Every symbol below was verified against the pinned AIlinux tree
# (git show <SRCREV>:drivers/net/wireless/...): a symbol name that does not
# exist there would silently disappear in `make olddefconfig`, so these names
# are not guesses.  Two rules learned from the first Stage 2 build, where the
# device-only fragment silently lost the Realtek and Atheros drivers:
#
#   * A symbol with no prompt (RTW88_CORE, RTW89_8852C, MT76_CORE,
#     ATH10K_CE, ...) cannot be set from a fragment; it is pulled in by
#     `select` from the device entries, so only the device entries are set.
#   * A device entry is only visible when its prompt-bearing parent is on, so
#     the parents RTW88, RTW89, ATH10K and ATH11K (`menuconfig`/`tristate`
#     with a prompt in the 7.4 tree) must be set as well - otherwise
#     `make olddefconfig` drops every child symbol.
#
# MT7921E/MT7921U do not need a parent: the MT76 core symbols are prompt-less
# and are selected by them, which the first build confirmed.
#
# Firmware for these drivers comes from the curated linux-firmware packages in
# conf/machine/neura-x86-64.conf; the wpa/iwd side is in
# conf/distro/neura.conf.

# --- Intel (iwlwifi) ------------------------------------------------------
# IWLDVM/IWLMVM are the DVM (older: 6000/6050/3160/7260) and MVM
# (newer: 8000/8265/9000/9260/ax) firmware-operation modules; IWLWIFI alone is
# only the PCIe transport.
CONFIG_IWLWIFI=m
CONFIG_IWLDVM=m
CONFIG_IWLMVM=m

# --- MediaTek MT7921 (Wi-Fi 6, very common in AMD-based laptops) ----------
CONFIG_MT7921E=m
CONFIG_MT7921U=m

# --- Realtek rtw88 -------------------------------------------------------
# RTW88 is the prompt-bearing menuconfig parent ("Realtek 802.11ac wireless
# chips support", depends on MAC80211); every device entry below depends on it.
CONFIG_RTW88=m
CONFIG_RTW88_8822BE=m
CONFIG_RTW88_8822CE=m
CONFIG_RTW88_8723DE=m
CONFIG_RTW88_8821CE=m
CONFIG_RTW88_8821CU=m
CONFIG_RTW88_8822CU=m

# --- Realtek rtw89 (Wi-Fi 6/6E/7) ----------------------------------------
CONFIG_RTW89=m
CONFIG_RTW89_8851BE=m
CONFIG_RTW89_8852AE=m
CONFIG_RTW89_8852BE=m
CONFIG_RTW89_8852CE=m
CONFIG_RTW89_8922AE=m
CONFIG_RTW89_8852AU=m

# --- Qualcomm atheros (ath10k = Wi-Fi 5, ath11k = Wi-Fi 6) ----------------
# ATH10K/ATH11K are prompt-bearing tristates (depends on MAC80211 && HAS_DMA);
# the *_PCI entries depend on them and select the bus plumbing (MHI_BUS, QRTR,
# ...), which is left to `select`.
CONFIG_ATH10K=m
CONFIG_ATH10K_PCI=m
CONFIG_ATH11K=m
CONFIG_ATH11K_PCI=m
