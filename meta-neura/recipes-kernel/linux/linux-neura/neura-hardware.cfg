# NEURA config fragment: drivers for x86-64 PC hardware that
# arch/x86/configs/x86_64_defconfig does not already cover.
#
# Deliberately short: the base defconfig already contains the storage, USB,
# wired-Ethernet, framebuffer/audio and virtio drivers a typical PC needs
# (BLK_DEV_SD, ATA, SATA_AHCI, ATA_PIIX, MD/DM, USB + XHCI/EHCI/OHCI/UHCI,
# USB_STORAGE, E100/E1000/E1000E/R8169/SKY2/TIGON3, DRM, DRM_I915,
# SND_HDA_INTEL, CFG80211/MAC80211/RFKILL, and the virtio set).  Only what is
# missing for NEURA target machines is added here, and nothing is removed by
# hand - driver selection happens exclusively through the kernel
# configuration.

# --- NVMe system disks (absent from x86_64_defconfig) ---
CONFIG_NVME_CORE=y
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_MULTIPATH=y

# --- AMD Radeon GPU (host GPU is AMD; amdgpu needs firmware files that arrive
#     with the linux-firmware stage, so it is built as modules for now) ---
CONFIG_DRM_AMDGPU=m

# --- newer wired NICs (2.5 GbE Intel I225/I226) ---
CONFIG_IGC=m

# --- fast USB mass storage (UAS) ---
CONFIG_USB_UAS=m

# Wi-Fi device drivers and their firmware blobs are added in the network stage
# (see README); the wireless core (CFG80211/MAC80211/RFKILL) is already
# enabled by the base defconfig.
