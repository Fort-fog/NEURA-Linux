# NEURA config fragment: what a systemd-based x86-64 UEFI system needs to
# reach a login prompt, plus the devices used by the QEMU/OVMF boot test.
#
# Base config: arch/x86/configs/x86_64_defconfig from the kernel tree.
# Merged with scripts/kconfig/merge_config.sh (see the linux-neura recipe),
# then expanded by `make olddefconfig`.  Values already set by the base
# defconfig are repeated here on purpose: they are requirements of the NEURA
# userspace, and pinning them keeps the boot path stable if the base defconfig
# changes.

# --- UEFI boot (grub-efi / EFI stub) ---
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_MIXED=y

# --- block devices, initramfs and root filesystems ---
CONFIG_BLOCK=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_MODULES=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
# The EFI system partition is always FAT.
CONFIG_VFAT_FS=y
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_AUTOFS_FS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# --- systemd runtime requirements ---
CONFIG_BINFMT_SCRIPT=y
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_POSIX_MQUEUE=y
CONFIG_KEYS=y
CONFIG_INOTIFY_USER=y
CONFIG_FANOTIFY=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_SCHED=y
CONFIG_MEMCG=y
CONFIG_SWAP=y
CONFIG_NET=y
CONFIG_UNIX=y
CONFIG_HW_RANDOM=y

# --- consoles ---
CONFIG_TTY=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y

# --- QEMU/OVMF boot test devices ---
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_HW_RANDOM_VIRTIO=y

# --- keep the toolchain requirements of the 0.1 stage minimal ---
CONFIG_RUST=n
CONFIG_MODULE_SIG_ALL=n
CONFIG_DEBUG_INFO_BTF=n
