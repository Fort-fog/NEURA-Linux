# NEURA Linux layer: distro configuration, machine definitions, the NEURA
# kernel recipe and image recipes.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "neura"
BBFILE_PATTERN_neura = "^${LAYERDIR}/"
BBFILE_PRIORITY_neura = "6"

# Layer compatibility with the Yocto 6.0 LTS (wrynose) release series, the
# baseline pinned by this repository (see README).
LAYERSERIES_COMPAT_neura = "wrynose"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_neura = "1"
