# NEURA Linux distribution configuration.
#
# Baseline (pinned, see README):
#   openembedded-core  wrynose @ 33a6bd6cc8a9a976902081642414bd67adc74879
#   meta-yocto         wrynose @ b60511544c41f5d29d290681e15c9e302f747efe
#   bitbake            2.18    @ 6e260eb6ab1631607ea414d9ff8ede1155faa5d9
#
# This file deliberately does NOT require conf/distro/poky.conf: NEURA is its
# own distro and must not inherit Poky's policies.  BitBake includes this file
# from conf/bitbake.conf and only afterwards includes
# conf/distro/include/defaultsetup.conf, which pulls in the generic distro
# plumbing (default-providers.inc, default-distrovars.inc, tclibc/tcmode,
# security flags, uninative and INIT_MANAGER -> conf/distro/include/init-manager-*.inc).
# None of that may be repeated here.

DISTRO_NAME = "NEURA Linux"
DISTRO_VERSION = "0.2"
DISTRO_CODENAME = "hw-net"
SDK_VENDOR = "-neura"
SDK_VERSION = "${DISTRO_VERSION}"
MAINTAINER = "NEURA Linux maintainers <maintainers@neura.invalid>"

TARGET_VENDOR = "-neura"

# systemd is the NEURA init system.  There is no INIT_MANAGER default in
# OE-Core 6.0 (Poky's own default is sysvinit), so set it hard;
# conf/distro/include/init-manager-systemd.inc then adds the systemd
# DISTRO_FEATURES and the systemd runtime providers (udev, login manager, ...).
INIT_MANAGER = "systemd"

# rpm is the packaging format used by OE-Core 6.0 itself.
PACKAGE_CLASSES ?= "package_rpm"

# DISTRO_FEATURES starts empty on purpose.  The OE-Core defaults
# (DISTRO_FEATURES_DEFAULTS in conf/distro/include/default-distrovars.inc) are
# appended automatically by conf/bitbake.conf through
# oe.utils.filter_default_features(); the 6.0 names
# DISTRO_FEATURES_DEFAULT / _BACKFILL / _BACKFILL_CONSIDERED are obsolete
# (see BB_RENAMED_VARIABLES in conf/bitbake.conf) and must not be used.
# Opt out of a default with, for example:
#   DISTRO_FEATURES_OPTED_OUT:append = " 32bit"
# and add NEURA-specific features with:
#   DISTRO_FEATURES:append = " wayland"   (Wayland stage, not 0.1)

# --- Stage 2 (NEURA 0.2 hw-net): network stack policy ----------------------
#
# NEURA uses the stock Yocto network stack: NetworkManager from
# meta-openembedded/meta-networking (with its internal DHCP client, so no
# dhcpcd/dhclient is needed) and iwd as the Wi-Fi backend.  No custom network
# manager and no custom Wi-Fi daemon are implemented in this layer.
#
# The 'wifi' DISTRO_FEATURE is already part of the OE-Core defaults
# (conf/distro/include/default-distrovars.inc), which is what enables the
# Wi-Fi code in NetworkManager ('wifi' is picked up by its
# bb.utils.filter('DISTRO_FEATURES', 'wifi polkit ppp', d)).

# OE-Core's switch for the Wi-Fi supplicant daemon (packagegroup-base.bb:
# "Choose either 'wpa-supplicant' or 'iwd' as wireless-daemon").
WIRELESS_DAEMON = "iwd"

# NetworkManager iwd backend: '-Diwd=true' plus the enable-iwd.conf drop-in
# that the networkmanager-wifi package ships.  The recipe's get_wifi_deps()
# then RDEPENDS iwd instead of wpa-supplicant, so wpa-supplicant stays out of
# the image.
PACKAGECONFIG:append:pn-networkmanager = " iwd"

# systemd's own networkd has to be switched off explicitly: it is enabled in
# the OE-Core systemd recipe's default PACKAGECONFIG, which both adds the
# systemd-networkd package (RRECOMMENDED from ${PN}) and the stock
# /usr/lib/systemd/network/80-wired.network unit that grabbed every wired
# interface in the 0.1 build.  Dropping the feature removes the package and
# the unit, leaving NetworkManager as the only interface handler.
PACKAGECONFIG:remove:pn-systemd = "networkd"

# Distro-wide class inheritance.  Same as conf/distro/include/defaultsetup.conf
# except for two removals:
#   debian        - deb packaging helpers, unused with package_rpm
#   create-spdx   - SPDX manifest generation; expensive and not needed until
#                   NEURA publishes release artefacts (re-enable for releases)
INHERIT_DISTRO = "devshell sstate license remove-libtool buildstats uninative"

# sstate signature handling used by OE-Core-based builds.
BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

# Keep the OE-Core build-host sanity check active and name the host NEURA is
# developed on (Ubuntu 24.04, x86-64).
SANITY_TESTED_DISTROS ?= " \
                ubuntu-24.04 \n \
                "

# The NEURA kernel is provided by this layer (recipes-kernel/linux/linux-neura)
# and selected in conf/machine/neura-x86-64.conf, so nothing is pinned here.
