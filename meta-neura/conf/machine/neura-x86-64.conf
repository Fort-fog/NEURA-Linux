#@TYPE: Machine
#@NAME: NEURA x86_64 PC (UEFI)
#@DESCRIPTION: Machine configuration for the NEURA x86_64 desktop baseline:
# UEFI boot, core2-64 user-space tuning for the widest PC compatibility, the
# NEURA kernel built from the AIlinux tree, and a partitioned EFI disk image.
#
# It reuses meta-yocto-bsp's proven generic x86 settings (wic/EFI image layout,
# grub-efi, qemuboot wiring, MACHINE_FEATURES) instead of re-inventing them.

DEFAULTTUNE ?= "core2-64"
require conf/machine/include/x86/tune-x86-64-v3.inc
require conf/machine/include/genericx86-common.inc

# --- kernel ---------------------------------------------------------------
# Hard assignment on purpose: conf/machine/include/x86/x86-base.inc and
# genericx86-common.inc both use ??= for virtual/kernel (linux-yocto).
# Overriding the provider makes the linux-yocto recipes skip themselves
# (bb.parse.SkipRecipe in linux.inc), so only linux-neura provides
# virtual/kernel and PREFERRED_VERSION_linux-yocto becomes irrelevant.
PREFERRED_PROVIDER_virtual/kernel = "linux-neura"

# --- image / boot artifacts ----------------------------------------------
# genericx86-common.inc already contributes: IMAGE_FSTYPES += "wic.zst wic.bmap",
# WKS_FILE = "genericx86.wks.in" (EFI system partition + ext4 root + swap),
# EFI_PROVIDER = grub-efi and the gptfdisk/bootimg wic task wiring.
# A plain (uncompressed) wic is added because runqemu refuses .zst images
# unless snapshot mode is used; the boot test boots the plain image.
IMAGE_FSTYPES += "wic"

# OVMF (UEFI firmware) is deployed next to the image so the boot test can run
# the image the way real x86-64 PCs boot it.
EXTRA_IMAGEDEPENDS += "ovmf"

# --- hardware firmware ----------------------------------------------------
# genericx86-common.inc contributes the linux-firmware metapackage.  That
# package holds no files of its own and RDEPENDS every split-out firmware
# package (the recipe pins FILES:${PN} = "" with the comment "Do not change
# this."), i.e. several hundred MB of blobs for devices a NEURA x86-64 PC
# cannot have.  So the metapackage stays removed and the packages the drivers
# enabled in recipes-kernel/linux/linux-neura actually request are listed
# explicitly - the same pattern meta-yocto-bsp uses in conf/machine/
# genericarm64.conf, including the 'wifi' DISTRO_FEATURE gate.
#
#   amdgpu     - AMD GPU firmware (aggregate package: it RDEPENDS every
#                amdgpu generation, navi*/vega/raven/renoir/rembrandt/...,
#                plus the Firmware-amdgpu licence package)
#   rtl-nic    - rtl_nic/*.fw* for Realtek r8168/r8125 wired NICs
#   iwlwifi    - aggregate for Intel Wireless (3160/7260/8265/9000/9260/...)
#   mediatek   - firmware/mediatek/*, which is where the MT7921/MT7925 blobs
#                live (there is no per-chip -mt7921 package)
#   ath10k / ath11k - aggregates for the Qualcomm Wi-Fi 5/6 PCIe families
#   rtl8723/rtl8821/rtl8822/rtl8851/rtl8852/rtl8922 - rtw88/rtw89 firmware;
#                Realtek firmware has no aggregate package, so the chips
#                supported by the neura-wifi.cfg fragment are named one by one
#                (these packages also carry the matching rtlwifi and rtl_bt
#                blobs; -rtl8723 includes firmware/rtw88/rtw8723*.bin)
NEURA_WIFI_FIRMWARE = "linux-firmware-iwlwifi linux-firmware-mediatek \
    linux-firmware-ath10k linux-firmware-ath11k linux-firmware-rtl8723 \
    linux-firmware-rtl8821 linux-firmware-rtl8822 linux-firmware-rtl8851 \
    linux-firmware-rtl8852 linux-firmware-rtl8922"

# The list is exported as NEURA_FIRMWARE_PACKAGES because a
# core-image-minimal-based rootfs does not get it from the machine: OE-Core
# routes MACHINE_EXTRA_RRECOMMENDS through the
# packagegroup-machine-base package (packagegroup-base.bb:130), which belongs to
# packagegroup-base - and an image built from core-image.bbclass only installs
# packagegroup-core-boot.  The image recipe therefore installs
# NEURA_FIRMWARE_PACKAGES directly; the machine recommends are kept so that
# richer images which do pull packagegroup-base pick the same set up.
NEURA_FIRMWARE_PACKAGES = "linux-firmware-amdgpu linux-firmware-rtl-nic"
NEURA_FIRMWARE_PACKAGES:append = " ${@bb.utils.contains('DISTRO_FEATURES', 'wifi', d.getVar('NEURA_WIFI_FIRMWARE'), '', d)}"

MACHINE_EXTRA_RRECOMMENDS:remove = "linux-firmware"
MACHINE_EXTRA_RRECOMMENDS:append = " ${NEURA_FIRMWARE_PACKAGES}"

# --- live image (Stage 2) -------------------------------------------------
# The live ISO/hddimg artifacts come from IMAGE_FSTYPES += "live" in the image
# recipe (meta/classes-recipe/image-live.bbclass is inherited automatically for
# the live/iso/hddimg fstypes).  Nothing has to be enabled here, but
# MACHINE_FEATURES must keep 'pcbios' (contributed by genericx86-common.inc
# together with 'efi' and 'wifi'): image-live.bbclass only runs
# "isohybrid -u" when PCBIOS is set, and that hybrid MBR is what lets the ISO
# be chainloaded from Ventoy and from most PC firmware boot menus.  Do not drop
# pcbios from this machine.

# --- runqemu (QEMU boot test) --------------------------------------------
QB_SYSTEM_NAME = "qemu-system-x86_64"
QB_DEFAULT_FSTYPE = "wic"
QB_MEM = "-m 2048"
