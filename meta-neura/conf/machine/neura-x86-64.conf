#@TYPE: Machine
#@NAME: NEURA x86_64 PC (UEFI)
#@DESCRIPTION: Machine configuration for the NEURA x86_64 desktop baseline:
# UEFI boot, core2-64 user-space tuning for the widest PC compatibility, the
# NEURA kernel built from the AIlinux tree, and a partitioned EFI disk image.
#
# It reuses meta-yocto-bsp's proven generic x86 settings (wic/EFI image layout,
# grub-efi, qemuboot wiring, MACHINE_FEATURES) instead of re-inventing them.

DEFAULTTUNE ?= "core2-64"
require conf/machine/include/x86/tune-x86-64-v3.inc
require conf/machine/include/genericx86-common.inc

# --- kernel ---------------------------------------------------------------
# Hard assignment on purpose: conf/machine/include/x86/x86-base.inc and
# genericx86-common.inc both use ??= for virtual/kernel (linux-yocto).
# Overriding the provider makes the linux-yocto recipes skip themselves
# (bb.parse.SkipRecipe in linux.inc), so only linux-neura provides
# virtual/kernel and PREFERRED_VERSION_linux-yocto becomes irrelevant.
PREFERRED_PROVIDER_virtual/kernel = "linux-neura"

# --- image / boot artifacts ----------------------------------------------
# genericx86-common.inc already contributes: IMAGE_FSTYPES += "wic.zst wic.bmap",
# WKS_FILE = "genericx86.wks.in" (EFI system partition + ext4 root + swap),
# EFI_PROVIDER = grub-efi and the gptfdisk/bootimg wic task wiring.
# A plain (uncompressed) wic is added because runqemu refuses .zst images
# unless snapshot mode is used; the boot test boots the plain image.
IMAGE_FSTYPES += "wic"

# OVMF (UEFI firmware) is deployed next to the image so the boot test can run
# the image the way real x86-64 PCs boot it.
EXTRA_IMAGEDEPENDS += "ovmf"

# Stage 0.1 (boot checkpoint): the QEMU devices used for the boot test
# (virtio / e1000, OVMF) need no firmware blobs, so the linux-firmware payload
# contributed by genericx86-common.inc is deferred to the Wi-Fi stage, where it
# is required and will be added back.
MACHINE_EXTRA_RRECOMMENDS:remove = "linux-firmware"

# --- runqemu (QEMU boot test) --------------------------------------------
QB_SYSTEM_NAME = "qemu-system-x86_64"
QB_DEFAULT_FSTYPE = "wic"
QB_MEM = "-m 2048"
